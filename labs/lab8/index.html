<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab 8 – JS Todo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Lab 8 – JavaScript</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3">Todo List</h1>

            <form id="todo-form" class="row g-2">
              <div class="col-9">
                <input id="todo-input" class="form-control" type="text" placeholder="Add a task..." required />
              </div>
              <div class="col-3 d-grid">
                <button class="btn btn-primary" type="submit">Add</button>
              </div>
            </form>

            <ul id="todo-list" class="list-group mt-3"></ul>

            <div class="d-flex justify-content-between mt-3">
              <button id="clear-completed" class="btn btn-outline-secondary btn-sm">Clear completed</button>
              <span id="count" class="text-muted small">0 items</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
